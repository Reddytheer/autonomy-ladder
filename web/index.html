<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>autonomy-ladder · operator console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { accent: { DEFAULT: "#2563eb", soft: "#dbeafe" } },
            fontFamily: { mono: ["ui-monospace", "SFMono-Regular", "Menlo", "monospace"] },
          },
        },
      };
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 text-[13px] leading-snug">
    <header class="border-b border-neutral-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center gap-6 px-4 py-2.5">
        <div class="flex items-baseline gap-2">
          <span class="font-semibold tracking-tight">autonomy-ladder</span>
          <span class="text-neutral-400">operator console</span>
        </div>
        <nav id="tabs" class="flex gap-1"></nav>
        <div class="ml-auto text-neutral-400" id="clock"></div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-4">
      <section id="view-dashboard" class="view"></section>
      <section id="view-queue" class="view hidden"></section>
      <section id="view-runs" class="view hidden"></section>
      <section id="view-ledger" class="view hidden"></section>
      <section id="view-security" class="view hidden"></section>
    </main>

    <div id="drawer" class="fixed inset-y-0 right-0 hidden w-full max-w-xl overflow-y-auto border-l border-neutral-200 bg-white shadow-xl"></div>
    <div id="scrim" class="fixed inset-0 hidden bg-black/20"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
