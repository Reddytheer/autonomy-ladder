[project]
name = "autonomy-ladder"
version = "0.1.0"
description = "A framework that lets an AI agent earn the right to act unsupervised, per task type, on measured performance — and lose it automatically when performance degrades."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Theertha Yalagiri" }]

# Runtime dependencies are intentionally minimal. The autonomy core (tiers,
# Wilson interval, controller, ledger, probation) has NO third-party runtime
# dependency beyond the stdlib and pydantic — it is the safety-critical code and
# is kept auditable. Wilson score and Cohen's kappa are implemented by hand
# rather than pulling in scipy (SPEC §2 P1: the controller must be simple,
# deterministic, and reviewable).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.scripts]
autonomy-ladder = "autonomy_ladder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomy_ladder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["autonomy_ladder"]
# Third-party libs without shipped type stubs.
[[tool.mypy.overrides]]
module = ["yaml", "anthropic.*", "opentelemetry.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["autonomy_ladder"]
branch = true
